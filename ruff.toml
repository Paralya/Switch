exclude = [".git", ".ruff_cache", ".venv", ".vscode", "build", "dist", "*.pyi"]
line-length = 200

[lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "T20", "RUF"]
ignore = [
    "T201",  # print() is how the tools talk to the developer
    "W191",  # indentation is tabs, alignment is spaces
    "N803",  # argument names follow the datapack vocabulary
    "N806",  # local constants stay uppercase when they mirror a generated name
]

[lint.isort]
# Keeps the "name as name" re-exports of a package grouped in a single statement
combine-as-imports = true
